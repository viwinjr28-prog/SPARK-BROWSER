
name: Build Spark Browser DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Get Spark Browser files
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Spark Browser DMG
        run: npm run dist -- --mac dmg --universal

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: Spark-Browser-DMG
          path: dist/*.dmg
          if-no-files-found: error
