name: Build Spark Browser DMG

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-macos-dmg:
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build macOS DMG
        run: npm run dist -- --mac dmg --universal

      - name: Upload DMG installer
        uses: actions/upload-artifact@v4
        with:
          name: Spark-Browser-macOS-DMG
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
